<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selfridges — Test Approval</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff;--bg2:#f4f3f0;--bg3:#ebe9e3;--bg4:#dddbd4;--bg5:#cccac2;
  --b1:#d0cfc8;--b2:#b8b6ae;--b3:#999890;
  --t1:#111;--t2:#333;--t3:#555;
  --yellow:#c07800;--yellow2:#a06000;
  --green:#1a6040;--amber:#8a4800;--red:#7a1010;
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;
  --serif:'Cormorant Garamond',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t1)}
body{font-family:var(--sans);font-size:16px;font-weight:300;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}

/* ── Header ── */
header{
  background:#000;border-bottom:1px solid #1a1a1a;
  height:56px;display:flex;align-items:center;
  padding:0 28px;gap:0;flex-shrink:0;position:relative;
}
header::after{
  content:'';position:absolute;bottom:0;left:0;
  height:2px;width:100%;
  background:linear-gradient(90deg,#f0c040 0%,#f0c040 140px,transparent 140px);
}
.wordmark{
  font-family:var(--serif);font-size:20px;font-weight:600;
  letter-spacing:.22em;text-transform:uppercase;color:#fff;
}
.tagline{
  font-size:9px;font-weight:600;letter-spacing:.3em;
  color:#f0c040;text-transform:uppercase;
  font-family:var(--sans);margin-top:4px;
}
.vline{width:1px;height:20px;background:#333;margin:0 20px}
.ikey{
  font-family:var(--mono);font-size:12px;color:#f0c040;
  padding:3px 10px;border:1px solid rgba(240,192,64,.4);
  background:rgba(240,192,64,.08);letter-spacing:.06em;
}
.ititle{font-size:14px;color:#ccc;margin-left:10px}
.sbadge{
  margin-left:auto;padding:3px 12px;font-size:11px;
  font-family:var(--mono);font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;border:1px solid;
}
.pending{color:var(--amber);border-color:rgba(200,148,26,.4)}
.approved,.partial{color:var(--green);border-color:rgba(61,153,112,.4);background:rgba(61,153,112,.05)}
.rejected{color:var(--red);border-color:rgba(176,48,32,.3)}
.uploaded{color:var(--yellow);border-color:rgba(240,192,64,.35);background:rgba(240,192,64,.05)}

/* ── Layout ── */
main{flex:1;max-width:820px;margin:0 auto;width:100%;padding:28px 28px 80px}

/* ── Progress ── */
.prog-wrap{height:2px;background:var(--b1);margin-bottom:28px}
.prog-bar{height:100%;background:var(--yellow);transition:width .35s}

/* ── Info box ── */
.info-box{
  border:1px solid var(--b1);padding:16px 20px;
  margin-bottom:24px;display:flex;gap:28px;flex-wrap:wrap;
  background:var(--bg2);
}
.iitem{display:flex;flex-direction:column;gap:3px}
.ilabel{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--t3);font-family:var(--sans)}
.ival{font-size:15px;color:var(--t1);font-weight:400}

/* ── Notice ── */
.notice{
  border-left:2px solid var(--yellow);background:rgba(240,192,64,.04);
  padding:11px 16px;margin-bottom:20px;font-size:14px;color:var(--t2);line-height:1.6;
}

/* ── Summary pills ── */
.sum-bar{display:flex;gap:8px;margin-bottom:18px;align-items:center;flex-wrap:wrap}
.spill{
  padding:3px 10px;font-family:var(--mono);font-size:9px;
  font-weight:500;letter-spacing:.07em;border:1px solid;
  text-transform:uppercase;
}
.sp-all{color:var(--t3);border-color:var(--b2)}
.sp-ok{color:var(--green);border-color:rgba(61,153,112,.35);background:rgba(61,153,112,.05)}
.sp-no{color:var(--red);border-color:rgba(176,48,32,.3);background:rgba(176,48,32,.05)}
.sp-pend{color:var(--amber);border-color:rgba(200,148,26,.35);background:rgba(200,148,26,.05)}

/* ── Test cards ── */
.tc{background:var(--bg2);border:1px solid var(--b1);border-radius:2px;margin-bottom:5px;overflow:hidden;transition:border-color .15s}
.tc.ok{border-color:rgba(61,153,112,.45);border-left:2px solid var(--green)}
.tc.no{border-color:rgba(176,48,32,.3);border-left:2px solid var(--red);opacity:.82}
.tc-hdr{
  padding:13px 16px;display:flex;align-items:center;
  gap:10px;cursor:pointer;user-select:none;
}
.tc-hdr:hover{background:rgba(255,255,255,.02)}
.tcnum{font-family:var(--mono);font-size:11px;color:var(--yellow);flex-shrink:0;min-width:46px;letter-spacing:.07em}
.tcname{flex:1;font-size:15px;font-weight:300;color:var(--t1);line-height:1.35}
.tcmeta{display:flex;gap:6px;align-items:center;flex-shrink:0}
.chip{padding:3px 9px;font-size:11px;font-family:var(--mono);font-weight:500;border:1px solid;text-transform:uppercase;letter-spacing:.06em}
.ch{color:var(--red);border-color:rgba(176,48,32,.35);background:rgba(176,48,32,.05)}
.cm{color:var(--amber);border-color:rgba(200,148,26,.35);background:rgba(200,148,26,.05)}
.cl{color:var(--t3);border-color:var(--b2)}
.cc{color:#d04040;border-color:rgba(208,64,64,.4);background:rgba(208,64,64,.06)}
.sc{padding:2px 8px;font-size:10px;font-weight:500;border:1px solid;font-family:var(--mono)}
.sc-ok{color:var(--green);border-color:rgba(61,153,112,.4)}
.sc-no{color:var(--red);border-color:rgba(176,48,32,.3)}
.chev{color:var(--t3);font-size:14px;transition:transform .2s;flex-shrink:0}
.chev.open{transform:rotate(90deg)}

.tc-body{display:none;border-top:1px solid var(--b1)}
.tc-body.open{display:block}
.tcs{padding:13px 16px;border-bottom:1px solid var(--b1)}
.tcs:last-child{border-bottom:none}
.tcs-lbl{font-size:8px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--t3);margin-bottom:7px;font-family:var(--sans)}
.tc-content{
  font-family:var(--mono);font-size:11px;color:var(--t2);
  white-space:pre-wrap;line-height:1.7;background:var(--bg3);
  padding:10px 13px;border:1px solid var(--b1);max-height:220px;overflow-y:auto;
}
.step-table{width:100%;border-collapse:collapse;font-size:13px;font-family:var(--mono)}
.step-table th{
  background:var(--bg3);color:var(--t2);font-weight:600;
  padding:8px 12px;text-align:left;border-bottom:1px solid var(--b1);
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;
}
.step-table td{padding:8px 11px;border-bottom:1px solid var(--b1);color:var(--t1);font-size:13px;vertical-align:top;line-height:1.55}
.step-table tr:last-child td{border-bottom:none}

/* ── Decision row ── */
.dec-row{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:12px 16px;border-top:1px solid var(--b1);
  background:rgba(255,255,255,.012);
}
.dec-btn{
  padding:7px 16px;border:1px solid var(--b2);background:transparent;
  font-size:9.5px;font-weight:600;cursor:pointer;color:var(--t2);
  transition:all .15s;font-family:var(--sans);letter-spacing:.12em;text-transform:uppercase;
}
.dec-btn.approve:hover,.dec-btn.on-approve{border-color:var(--green);color:var(--green);background:rgba(61,153,112,.06)}
.dec-btn.reject:hover,.dec-btn.on-reject{border-color:var(--red);color:var(--red);background:rgba(176,48,32,.06)}
.cbox{
  flex:1;background:var(--bg3);border:1px solid var(--b2);
  padding:7px 11px;color:var(--t1);font-size:12px;
  outline:none;font-family:var(--mono);font-weight:400;
  transition:border-color .15s;min-width:160px;
}
.cbox:focus{border-color:var(--yellow)}
.cbox::placeholder{color:var(--t3)}

/* ── Footer ── */
.footer{
  position:fixed;bottom:0;left:0;width:100%;
  background:#f4f3f0;border-top:1px solid var(--b1);
  padding:16px 28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  backdrop-filter:blur(4px);z-index:10;
}
.ninput{
  background:var(--bg3);border:1px solid var(--b2);
  padding:9px 13px;color:var(--t1);font-size:12px;
  outline:none;width:210px;font-family:var(--mono);
  transition:border-color .15s;
}
.ninput:focus{border-color:var(--yellow)}
.ninput::placeholder{color:var(--t3)}
.btn-p{
  padding:9px 22px;border:1px solid var(--yellow);background:var(--yellow);
  color:#000;font-size:9.5px;font-weight:700;cursor:pointer;
  font-family:var(--sans);letter-spacing:.14em;text-transform:uppercase;transition:all .15s;
}
.btn-p:hover{background:var(--yellow2);border-color:var(--yellow2)}
.btn-p:disabled{opacity:.3;cursor:not-allowed}
.sstatus{font-size:13px;font-family:var(--mono);color:var(--t3)}
.sstatus.ok{color:var(--green)}
.sstatus.err{color:var(--red)}
.dec-count{margin-left:auto;font-size:9px;font-family:var(--mono);color:var(--t3);letter-spacing:.07em}

/* ── Loading ── */
.loading{
  display:flex;align-items:center;justify-content:center;
  height:240px;color:var(--t3);font-size:12px;gap:12px;
  font-family:var(--mono);letter-spacing:.06em;
}
.spin{
  width:16px;height:16px;border:1.5px solid var(--b2);
  border-top-color:var(--yellow);border-radius:50%;
  animation:spin .6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:2px;height:2px}
::-webkit-scrollbar-thumb{background:var(--b3)}
</style>
</head>
<body>

<header>
  <div style="display:flex;flex-direction:column">
    <span class="wordmark">Selfridges</span>
    <span class="tagline">Test Curator</span>
  </div>
  <div class="vline"></div>
  <span class="ikey" id="hdrKey">…</span>
  <span class="ititle" id="hdrTitle"></span>
  <span class="sbadge pending" id="hdrStatus">loading</span>
</header>

<main>
  <div class="prog-wrap"><div class="prog-bar" id="progBar" style="width:0%"></div></div>
  <div class="loading" id="loadingEl"><div class="spin"></div>Loading approval request…</div>

  <div id="content" style="display:none">
    <div class="info-box" id="infoBox"></div>
    <div id="notice" style="display:none"></div>
    <div class="sum-bar" id="sumBar"></div>
    <div id="testList"></div>
  </div>
</main>

<div class="footer" id="footer" style="display:none">
  <input class="ninput" id="approverName" placeholder="Your name / ID" maxlength="60">
  <button class="btn-p" id="submitBtn" onclick="submitReview()">Submit Review</button>
  <span class="sstatus" id="sstatus"></span>
  <span class="dec-count" id="decCount">0 / 0 reviewed</span>
</div>

<script>
let apr=null;
const dec={};

async function init(){
  const id=location.pathname.split('/approve/')[1];
  if(!id){showErr('No approval ID in URL');return}
  try{
    const r=await fetch('/api/approvals/'+id+'/data');
    if(!r.ok)throw new Error('Approval not found — it may have expired or been deleted.');
    apr=await r.json();
    if(typeof apr==='string'){try{apr=JSON.parse(apr);}catch{throw new Error('Malformed approval data received from server.');}}
    if(!apr||typeof apr!=='object')throw new Error('Invalid approval data received from server.');
    if(!Array.isArray(apr.testCases)){throw new Error('Approval is missing test cases. Please delete this request and send for approval again.');}
    render();
  }catch(e){showErr(e.message)}
}

function showErr(msg){
  document.getElementById('loadingEl').innerHTML=
    '<div style="text-align:center;padding:20px">'+
    '<div style="font-size:11px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px">Error</div>'+
    '<div style="font-size:13px;color:var(--red);max-width:380px;line-height:1.6">'+esc(msg)+'</div></div>';
}

function render(){
  const done=['approved','partial','rejected','uploaded'].includes(apr.status);
  // Header
  document.getElementById('hdrKey').textContent=apr.issueKey;
  document.getElementById('hdrTitle').textContent=apr.issueSummary||'';
  const b=document.getElementById('hdrStatus');
  b.textContent=apr.status;b.className='sbadge '+apr.status;
  document.title='Review: '+apr.issueKey+' — Selfridges Test Curator';
  // Info box
  document.getElementById('infoBox').innerHTML=[
    ii('Requested by',apr.requestedBy),
    ii('Date',new Date(apr.requestedAt).toLocaleString()),
    ii('Test cases',String(apr.testCases.length)),
    apr.approvedBy?ii('Reviewed by',apr.approvedBy):'',
    apr.status==='uploaded'?ii('Zephyr keys',(apr.zephyrKeys||[]).join(', ')):'',
  ].filter(Boolean).join('');
  // Notice
  if(done){
    const n=document.getElementById('notice');n.style.display='block';
    n.innerHTML='<div class="notice">'+
      (apr.status==='uploaded'
        ? '✓ Test cases uploaded to Zephyr Scale and Knowledge Base. Jira comment posted.'
        : '✓ Review submitted by '+esc(apr.approvedBy||'')+'. Awaiting upload.'
      )+'</div>';
  }
  renderTests();updateSum();
  document.getElementById('footer').style.display=done?'none':'flex';
  document.getElementById('loadingEl').style.display='none';
  document.getElementById('content').style.display='block';
  if(apr.testCases.length>0&&!done)setTimeout(()=>toggle(0,true),80);
}

function ii(label,val){
  return '<div class="iitem"><div class="ilabel">'+esc(label)+'</div><div class="ival">'+esc(val)+'</div></div>';
}

function renderTests(){
  const done=['approved','partial','rejected','uploaded'].includes(apr.status);
  document.getElementById('testList').innerHTML=apr.testCases.map((tc,i)=>{
    const d=dec[tc.id]||{};
    const isOk=done?tc.approved:d.approved===true;
    const isNo=done?tc.rejected:d.approved===false;
    const p=(tc.priority||'medium').toLowerCase();
    const pc=p==='critical'?'cc':p==='high'?'ch':p==='low'?'cl':'cm';
    const cc='tc'+(isOk?' ok':isNo?' no':'');
    let sc='';
    if(isOk)sc='<span class="sc sc-ok">✓ Approved</span>';
    else if(isNo)sc='<span class="sc sc-no">✗ Rejected</span>';

    // Steps
    let steps='';
    if(tc.steps&&tc.steps.length){
      steps='<div class="tcs"><div class="tcs-lbl">Test Steps</div>'+
        '<table class="step-table"><thead><tr><th style="width:34px">#</th><th>Action</th><th>Expected Result</th></tr></thead><tbody>'+
        tc.steps.map((s,si)=>'<tr><td style="text-align:center;color:var(--t3)">'+(si+1)+'</td><td>'+esc(s.description||'')+'</td><td>'+esc(s.expectedResult||'')+'</td></tr>').join('')+
        '</tbody></table></div>';
    }
    const pre=tc.precondition?'<div class="tcs"><div class="tcs-lbl">Preconditions</div><div style="font-size:14px;color:var(--t2);line-height:1.6;font-weight:300">'+esc(tc.precondition)+'</div></div>':'';
    const content=tc.content?'<div class="tcs"><div class="tcs-lbl">Full Content</div><div class="tc-content">'+esc(tc.content)+'</div></div>':'';
    const decRow=done?'':`<div class="dec-row">
      <button class="dec-btn approve${d.approved===true?' on-approve':''}" onclick="decide(${tc.id},true,${i})">✓ Approve</button>
      <button class="dec-btn reject${d.approved===false?' on-reject':''}" onclick="decide(${tc.id},false,${i})">✗ Reject</button>
      <input class="cbox" id="com-${tc.id}" placeholder="Comment (optional)"${d.comment?' value="'+esc(d.comment)+'"':''} oninput="dec[${tc.id}]={...dec[${tc.id}]||{},comment:this.value}">
    </div>`;
    const aprCom=done&&tc.approverComment?'<div class="tcs" style="font-size:14px;color:var(--t2)">💬 '+esc(tc.approverComment)+'</div>':'';

    return `<div class="${cc}" id="tc-${tc.id}">
      <div class="tc-hdr" onclick="toggle(${i})">
        <span class="tcnum">TC-${String(i+1).padStart(3,'0')}</span>
        <span class="tcname">${esc(tc.name||'Untitled')}</span>
        <div class="tcmeta"><span class="chip ${pc}">${esc(tc.priority||'Medium')}</span>${sc}</div>
        <span class="chev" id="chev-${i}">›</span>
      </div>
      <div class="tc-body" id="body-${i}">${pre}${steps}${content}${decRow}${aprCom}</div>
    </div>`;
  }).join('');
}

function toggle(i,force){
  const b=document.getElementById('body-'+i),c=document.getElementById('chev-'+i);
  if(!b)return;
  const open=force!==undefined?force:!b.classList.contains('open');
  b.classList.toggle('open',open);c.classList.toggle('open',open);
}

function decide(id,approved,idx){
  dec[id]={...(dec[id]||{}),approved};
  renderTests();updateSum();
  const next=apr.testCases.find(tc=>dec[tc.id]?.approved===undefined);
  if(next){
    const ni=apr.testCases.indexOf(next);
    setTimeout(()=>toggle(ni,true),50);
    document.getElementById('tc-'+next.id)?.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}

function updateSum(){
  const total=apr.testCases.length;
  const ok=Object.values(dec).filter(d=>d.approved===true).length;
  const no=Object.values(dec).filter(d=>d.approved===false).length;
  const pend=total-ok-no;
  document.getElementById('sumBar').innerHTML=
    `<span class="spill sp-all">${total} total</span>`+
    `<span class="spill sp-ok">${ok} approved</span>`+
    `<span class="spill sp-no">${no} rejected</span>`+
    (pend>0?`<span class="spill sp-pend">${pend} pending</span>`:'');
  document.getElementById('decCount').textContent=(ok+no)+' / '+total+' reviewed';
  document.getElementById('progBar').style.width=(((ok+no)/total)*100)+'%';
}

async function submitReview(){
  const name=document.getElementById('approverName').value.trim();
  if(!name){alert('Please enter your name or ID.');return}
  const undecided=apr.testCases.filter(tc=>dec[tc.id]?.approved===undefined);
  if(undecided.length&&!confirm(undecided.length+' test(s) not yet reviewed.\nUnreviewed tests will be marked rejected. Continue?'))return;
  const btn=document.getElementById('submitBtn'),st=document.getElementById('sstatus');
  btn.disabled=true;st.className='sstatus';st.textContent='Submitting…';
  try{
    const r=await fetch('/api/approvals/'+apr.id+'/review',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({approverName:name,decisions:apr.testCases.map(tc=>({id:tc.id,approved:dec[tc.id]?.approved??false,comment:dec[tc.id]?.comment||''}))})
    });
    const data=await r.json();
    if(data.ok){
      document.getElementById('footer').style.display='none';
      st.className='sstatus ok';
      st.innerHTML='✓ '+data.approvedCount+' approved · '+data.rejectedCount+' rejected';
      document.getElementById('hdrStatus').textContent='reviewed';
      document.getElementById('hdrStatus').className='sbadge approved';
      setTimeout(()=>location.reload(),2200);
    }else throw new Error(data.error||'Unknown error');
  }catch(e){btn.disabled=false;st.className='sstatus err';st.textContent='Error: '+e.message}
}

function esc(s){
  if(!s)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

init();
</script>
</body>
</html>
