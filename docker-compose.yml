services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tma-kb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tma_kb
      POSTGRES_USER: tma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/kb/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tma -d tma_kb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
